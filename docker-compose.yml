services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: jejak_audit
      MARIADB_USER: jejak
      MARIADB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di file .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://jejak:${DB_PASSWORD}@db:3306/jejak_audit
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

  # phpMyAdmin opsional: docker compose --profile tools up -d, lalu buka http://IP-SERVER:8080
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "${PMA_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
